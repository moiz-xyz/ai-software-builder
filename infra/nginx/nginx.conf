# Reverse proxy for the platform, all customer subdomains (<slug>.ROOT_DOMAIN)
# and verified custom domains. Next.js routes by Host header; /api/* is proxied
# by Next to the NestJS API, so nginx only needs to reach the web container.
events {}
http {
  client_max_body_size 10m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream web { server web:3100; }

  # HTTP: ACME challenges + redirect to HTTPS
  server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # Platform + wildcard customer subdomains (wildcard cert for *.ROOT_DOMAIN via DNS-01)
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/wildcard/privkey.pem;
    include /etc/nginx/certs/custom/*.conf;   # per-custom-domain server blocks written by issue-certs.sh

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
